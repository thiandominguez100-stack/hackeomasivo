name: NEXUS tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/intel-dashboard.test.cjs
      - run: node --test tests/incidents.test.cjs
      - run: node --check app.js
      - run: node --check incidents.js
      - run: python -m py_compile scripts/refresh_intel.py
      - run: python -m unittest discover -s tests -p "test_*.py"
