name: NEXUS threat intelligence refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intel-refresh.yml"
      - "scripts/refresh_intel.py"

permissions:
  contents: write

concurrency:
  group: nexus-intel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public defensive telemetry
        run: python scripts/refresh_intel.py
      - name: Publish static data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --cached --quiet; then
            echo "No data changes to publish."
          else
            git commit -m "chore: refresh public threat intelligence snapshot"
            git push
          fi
