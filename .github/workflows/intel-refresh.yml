name: NEXUS threat intelligence refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/intel-refresh.yml"
      - "scripts/refresh_intel.py"

permissions:
  contents: write

concurrency:
  group: nexus-intel-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public defensive telemetry
        run: python scripts/refresh_intel.py
      - name: Publish snapshot safely despite concurrent commits
        shell: bash
        run: |
          set -euo pipefail
          cp data/current.json "$RUNNER_TEMP/nexus-current.json"
          cp data/publications-history.json "$RUNNER_TEMP/nexus-history.json"

          for attempt in 1 2 3 4 5; do
            echo "Publishing snapshot attempt $attempt/5"
            git fetch --no-tags origin main:refs/remotes/origin/main
            git reset --hard origin/main
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            mkdir -p data
            cp "$RUNNER_TEMP/nexus-current.json" data/current.json
            cp "$RUNNER_TEMP/nexus-history.json" data/publications-history.json
            git add data/current.json data/publications-history.json

            if git diff --cached --quiet; then
              echo "The latest snapshot is already published."
              exit 0
            fi

            git commit -m "chore: refresh public threat intelligence snapshot"
            if git push origin HEAD:main; then
              echo "Snapshot published successfully."
              exit 0
            fi

            echo "The main branch moved during publication; retrying with the latest branch head."
            sleep 2
          done

          echo "Could not publish the snapshot after five attempts."
          exit 1
