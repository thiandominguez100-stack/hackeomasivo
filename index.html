<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071019">
  <meta name="description" content="Simulación visual y local de tres millones de eventos ficticios sobre un globo mundial interactivo.">
  <meta name="color-scheme" content="dark">
  <title>NEXUS — Simulación global</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <main id="boot-message" style="margin:2rem;padding:1rem;color:#d8e7f2;font:14px system-ui">Preparando el centro de operaciones…</main>
  <script type="module">
    async function loadGzip(path) {
      if (!('DecompressionStream' in window)) throw new Error('Actualizá tu navegador para abrir esta aplicación.');
      const response = await fetch(path);
      if (!response.ok) throw new Error(`No se pudo cargar ${path} (${response.status}).`);
      return new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).text();
    }

    try {
      const [markup, css, simulation, globe, app] = await Promise.all([
        loadGzip('./assets/runtime/page.html.gz'),
        loadGzip('./assets/runtime/styles.css.gz'),
        loadGzip('./assets/runtime/simulation.js.gz'),
        loadGzip('./assets/runtime/globe.js.gz'),
        loadGzip('./assets/runtime/app.js.gz'),
      ]);
      document.body.innerHTML = markup;
      const style = document.createElement('style');
      style.textContent = css;
      document.head.append(style);
      const simulationUrl = URL.createObjectURL(new Blob([simulation], { type: 'text/javascript' }));
      const globeUrl = URL.createObjectURL(new Blob([globe], { type: 'text/javascript' }));
      const appSource = app
        .replaceAll("from './simulation.js'", `from '${simulationUrl}'`)
        .replaceAll("from './globe.js'", `from '${globeUrl}'`);
      await import(URL.createObjectURL(new Blob([appSource], { type: 'text/javascript' })));
    } catch (error) {
      document.body.innerHTML = '';
      const warning = document.createElement('p');
      warning.setAttribute('role', 'alert');
      warning.style.cssText = 'margin:2rem;padding:1rem;color:#fff;background:#7f1d1d;border-radius:12px;font:14px system-ui';
      warning.textContent = `No se pudo iniciar la simulación: ${error.message}`;
      document.body.append(warning);
      console.error(error);
    }
  </script>
</body>
</html>
